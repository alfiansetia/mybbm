steps:
  # 1. Build image (VITE_* dibake ke bundle di tahap ini)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/mybbm:$SHORT_SHA'
      - '--build-arg'
      - 'VITE_FIREBASE_API_KEY=$_VITE_FIREBASE_API_KEY'
      - '--build-arg'
      - 'VITE_FIREBASE_AUTH_DOMAIN=$_VITE_FIREBASE_AUTH_DOMAIN'
      - '--build-arg'
      - 'VITE_FIREBASE_PROJECT_ID=$_VITE_FIREBASE_PROJECT_ID'
      - '--build-arg'
      - 'VITE_FIREBASE_STORAGE_BUCKET=$_VITE_FIREBASE_STORAGE_BUCKET'
      - '--build-arg'
      - 'VITE_FIREBASE_MESSAGING_SENDER_ID=$_VITE_FIREBASE_MESSAGING_SENDER_ID'
      - '--build-arg'
      - 'VITE_FIREBASE_APP_ID=$_VITE_FIREBASE_APP_ID'
      - '--build-arg'
      - 'VITE_FIRESTORE_DATABASE_ID=$_VITE_FIRESTORE_DATABASE_ID'
      - '--build-arg'
      - 'VITE_GOOGLE_MAPS_API_KEY=$_VITE_GOOGLE_MAPS_API_KEY'
      - '--build-arg'
      - 'VITE_GOOGLE_PLACES_API_KEY=$_VITE_GOOGLE_PLACES_API_KEY'
      - '--build-arg'
      - 'VITE_GOOGLE_MAPS_MAP_ID=$_VITE_GOOGLE_MAPS_MAP_ID'
      - '.'

  # 2. Push ke Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/mybbm:$SHORT_SHA']

  # 3. Deploy ke Cloud Run (secret server hanya sebagai runtime vars)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'mybbm'
      - '--image'
      - 'gcr.io/$PROJECT_ID/mybbm:$SHORT_SHA'
      - '--region'
      - '$_REGION'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GEMINI_API_KEY=$_GEMINI_API_KEY,GEMINI_MODEL=$_GEMINI_MODEL'

substitutions:
  _REGION: asia-southeast2
  _GEMINI_MODEL: gemini-3.8-flash
  _GEMINI_API_KEY: ''
  _VITE_FIREBASE_API_KEY: ''
  _VITE_FIREBASE_AUTH_DOMAIN: ''
  _VITE_FIREBASE_PROJECT_ID: ''
  _VITE_FIREBASE_STORAGE_BUCKET: ''
  _VITE_FIREBASE_MESSAGING_SENDER_ID: ''
  _VITE_FIREBASE_APP_ID: ''
  _VITE_FIRESTORE_DATABASE_ID: ''
  _VITE_GOOGLE_MAPS_API_KEY: ''
  _VITE_GOOGLE_PLACES_API_KEY: ''
  _VITE_GOOGLE_MAPS_MAP_ID: 'DEMO_MAP_ID'

options:
  logging: CLOUD_LOGGING_ONLY
